<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a New Password | AI Code Review Assistant</title>
    <link rel="icon" type="image/svg+xml" href="assets/brand-logo.svg">
    <link rel="apple-touch-icon" href="assets/brand-logo.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="forgot-password-page">
    <div class="login-background" aria-hidden="true">
        <div class="circle circle1"></div>
        <div class="circle circle2"></div>
        <div class="circle circle3"></div>
        <div class="grid-overlay"></div>
    </div>
    <main class="login-section">
        <div class="login-container">
            <section class="login-card" aria-labelledby="reset-title">
                <div class="card-header">
                    <h1 id="reset-title">Choose a New Password</h1>
                    <p>Enter a new password for your account.</p>
                </div>
                <form class="login-form" id="reset-password-form">
                    <div class="input-group">
                        <label for="new-password">New password</label>
                        <div class="input-box">
                            <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="6" maxlength="128" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="confirm-password">Confirm new password</label>
                        <div class="input-box">
                            <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" maxlength="128" required>
                        </div>
                    </div>
                    <button type="submit" class="login-btn">Update Password</button>
                </form>
                <p class="reset-status" aria-live="polite"></p>
                <div class="signup-link"><p><a href="login.html">Back to login</a></p></div>
            </section>
        </div>
    </main>
    <script src="js/api.js"></script>
    <script>
        const resetForm = document.querySelector("#reset-password-form");
        const resetStatus = document.querySelector(".reset-status");
        const resetToken = new URLSearchParams(window.location.search).get("token");

        if (!resetToken) {
            resetForm.hidden = true;
            resetStatus.textContent = "This reset link is invalid. Request a new password reset link.";
        }

        resetForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            const password = document.querySelector("#new-password").value;
            const confirmation = document.querySelector("#confirm-password").value;
            const button = resetForm.querySelector("button[type='submit']");

            if (password !== confirmation) {
                resetStatus.textContent = "The passwords do not match.";
                return;
            }

            button.disabled = true;
            button.textContent = "Updating…";
            resetStatus.textContent = "";
            try {
                const result = await apiRequest("/auth/password-reset/complete", {
                    method: "POST",
                    body: JSON.stringify({ token: resetToken, password })
                });
                resetForm.hidden = true;
                resetStatus.textContent = result.message;
            } catch (error) {
                resetStatus.textContent = error.message;
            } finally {
                button.disabled = false;
                button.textContent = "Update Password";
            }
        });
    </script>
</body>
</html>
