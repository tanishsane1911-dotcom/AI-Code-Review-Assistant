<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | AI Code Review Assistant</title>
    <link rel="icon" type="image/svg+xml" href="assets/brand-logo.svg">
    <link rel="apple-touch-icon" href="assets/brand-logo.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="css/app-shell.css">
</head>
<body>
    <aside class="sidebar">
        <a href="dashboard.html" class="logo"><i class="fa-solid fa-shield-halved"></i><span>AI Code Review Assistant</span></a>
        <ul class="sidebar-menu">
            <li><a href="dashboard.html"><i class="fa-solid fa-chart-line"></i><span>Dashboard</span></a></li>
            <li><a href="review.html"><i class="fa-solid fa-code"></i><span>Review Code</span></a></li>
            <li><a href="report.html"><i class="fa-solid fa-file-lines"></i><span>Reports</span></a></li>
            <li><a href="history.html"><i class="fa-solid fa-clock-rotate-left"></i><span>History</span></a></li>
            <li><a href="profile.html"><i class="fa-solid fa-user"></i><span>Profile</span></a></li>
            <li class="active"><a href="settings.html"><i class="fa-solid fa-gear"></i><span>Settings</span></a></li>
            <li><a href="contact.html"><i class="fa-solid fa-envelope"></i><span>Contact</span></a></li>
            <li><a href="index.html" class="logout-link"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a></li>
        </ul>
    </aside>
    <main class="main-content">
        <header class="top-navbar">
            <div class="page-title"><h1>Settings</h1><p>Control review defaults, notifications, and workspace security.</p></div>
            <div class="top-right">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Search settings...">
                </div>
                <button class="notification"><i class="fa-solid fa-bell"></i></button>
                <div class="profile-box">
                    <img src="assets/user-avatar.svg" alt="User">
                    <div><h4>Account</h4><span>Signed in user</span></div>
                </div>
            </div>
        </header>
        <section class="profile-content">
            <div class="content-grid">
                <div class="content-card">
                    <div class="card-header"><h3><i class="fa-solid fa-sliders"></i> Review Preferences</h3></div>
                    <div class="info-list">
                        <label class="info-item"><span class="info-label">Default language</span><select class="setting-control" data-setting="language"><option>Auto detect</option><option>JavaScript</option><option>Python</option><option>Java</option><option>C#</option></select></label>
                        <label class="info-item"><span class="info-label">Security checks</span><input class="setting-control" data-setting="security" type="checkbox" checked></label>
                        <label class="info-item"><span class="info-label">Performance checks</span><input class="setting-control" data-setting="performance" type="checkbox" checked></label>
                    </div>
                </div>
                <div class="content-card">
                    <div class="card-header"><h3><i class="fa-solid fa-bell"></i> Notifications</h3></div>
                    <div class="info-list">
                        <label class="info-item"><span class="info-label">Email reports</span><input class="setting-control" data-setting="emailReports" type="checkbox" checked></label>
                        <label class="info-item"><span class="info-label">Weekly summary</span><select class="setting-control" data-setting="weeklySummary"><option>Off</option><option>Monday</option><option selected>Friday</option></select></label>
                        <label class="info-item"><span class="info-label">Critical alerts</span><select class="setting-control" data-setting="criticalAlerts"><option>Off</option><option selected>Instant</option></select></label>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="js/app-shell.js"></script>
</body>
</html>
