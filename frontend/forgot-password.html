<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | AI Code Review Assistant</title>
    <link rel="icon" type="image/svg+xml" href="assets/brand-logo.svg">
    <link rel="apple-touch-icon" href="assets/brand-logo.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="forgot-password-page">
    <div class="login-background">
        <div class="circle circle1"></div>
        <div class="circle circle2"></div>
        <div class="circle circle3"></div>
        <div class="grid-overlay"></div>
    </div>
    <section class="login-section">
        <div class="login-container">
            <div class="login-card">
                <div class="card-header">
                    <h2>Reset Password</h2>
                    <p>Enter your account email and we’ll send you a secure reset link.</p>
                </div>
                <form class="login-form">
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <div class="input-box">
                            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
                        </div>
                    </div>
                    <button type="submit" class="login-btn">Send Reset Link</button>
                </form>
                <p class="reset-status" aria-live="polite"></p>
                <div class="signup-link"><p><a href="login.html">Back to login</a></p></div>
            </div>
        </div>
    </section>
    <script src="js/api.js"></script>
    <script>
        document.querySelector(".login-form")?.addEventListener("submit", async (event) => {
            event.preventDefault();
            const email = document.querySelector("#email").value.trim();
            const button = event.currentTarget.querySelector("button[type='submit']");
            const status = document.querySelector(".reset-status");
            button.disabled = true;
            button.textContent = "Sending…";
            status.textContent = "";
            try {
                const result = await apiRequest("/auth/password-reset/request", {
                    method: "POST",
                    body: JSON.stringify({ email })
                });
                status.textContent = result.message;
            } catch (error) {
                status.textContent = error.message;
            } finally {
                button.disabled = false;
                button.textContent = "Send Reset Link";
            }
        });
    </script>
</body>
</html>
